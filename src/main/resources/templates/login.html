<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<div class="container">
    <aside th:replace="~{fragments/layout :: sidebar('login')}"></aside>

    <main class="content">
        <h1>Iniciar sesión</h1>

        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="mensaje error" th:if="${param.error != null and param.error[0] == 'credenciales'}">
            Usuario o contraseña incorrectos.
        </div>
        <div class="mensaje error" th:if="${param.error != null and param.error[0] == 'no_autenticado'}">
            Debe iniciar sesión para acceder a esa sección.
        </div>

        <form class="formulario" th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required autofocus />

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required />

            <button class="boton" type="submit">Entrar</button>
        </form>

        <p class="nota">¿Aún no tiene cuenta? <a th:href="@{/registro}">Regístrese como paciente</a>.</p>
        <p class="nota demo">Cuentas de prueba: <code>admin / admin123</code> &nbsp;·&nbsp; <code>paciente1 / 1234</code></p>
    </main>
</div>
</body>
</html>
